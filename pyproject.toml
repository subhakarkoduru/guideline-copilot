[project]
name = "guideline-copilot"
version = "0.1.0"
description = "Guideline Copilot"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
